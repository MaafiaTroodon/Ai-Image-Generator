<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Registration</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
    <div id="notificationBar" class="notification"></div>

  <h1>Registration Page</h1>

  <form id="registrationForm" novalidate>
    <div class="form-group">
      <label for="regEmail">Email:</label>
      <input type="email" id="regEmail" name="regEmail" required />
      <small class="error-message" id="emailError"></small>
    </div>

    <div class="form-group">
      <label for="regUsername">Username:</label>
      <input type="text" id="regUsername" name="regUsername" required />
      <small class="error-message" id="usernameError"></small>
    </div>

    <div class="form-group">
      <label for="regPassword">Password:</label>
      <input type="password" id="regPassword" name="regPassword" required />
      <small class="error-message" id="passwordError"></small>
    </div>

    <div class="form-group">
      <label for="regConfirmPassword">Confirm Password:</label>
      <input type="password" id="regConfirmPassword" name="regConfirmPassword" required />
      <small class="error-message" id="confirmPasswordError"></small>
    </div>

    <button type="submit">Register</button>
  </form>

  <!-- Success/failure messages here -->
  <div id="registrationFeedback"></div>

  <button onclick="location.href='login.html'" style="margin-top: 10px;">Go to Login</button>


  <!-- Scripts -->
  <script src="script/data.js"></script>
  <script src="script/registration.js"></script>
  

</body>
</html>
